name: 每日A股强势股扫描 (北京时间17:00)

on:
  schedule:
    - cron: '0 9 * * 1-5'   # UTC 09:00 = 北京时间 17:00，周一到周五
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy akshare baostock tqdm openpyxl requests

      - name: 运行强势股扫描器
        run: python stock_scanner_v79.py

      - name: 提交结果并微信推送 Download 链接
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p results

          # 优先使用本次生成的固定文件名
          if [ -f results/latest.xlsx ]; then
            FILE="results/latest.xlsx"
          else
            FILE=$(ls -t results/*.xlsx 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "没有生成 Excel，跳过推送"
            exit 0
          fi

          echo "将提交文件: $FILE"

          # results 可能被 gitignore，强制加入
          git add -f results/latest.xlsx 2>/dev/null || true
          git add -f results/*.xlsx 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "auto stock scan $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          else
            echo "无文件变更（可能 latest 内容相同），仍推送下载链接"
          fi

          # 固定英文路径，无中文、无历史时间戳混淆
          RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/results/latest.xlsx"

          echo "Download URL: $RAW_URL"

          if [ -z "${PUSHPLUS_TOKEN}" ]; then
            echo "未配置 PUSHPLUS_TOKEN，跳过微信推送"
            exit 0
          fi

          # 微信只推这一条 Download 链接
          curl -sS -X POST "http://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${PUSHPLUS_TOKEN}\",\"title\":\"A-share scan Download\",\"content\":\"${RAW_URL}\",\"template\":\"txt\"}"

          echo "PushPlus 已发送"
