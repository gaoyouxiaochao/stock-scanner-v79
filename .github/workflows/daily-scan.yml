name: 每日A股强势股扫描

on:
  schedule:
    - cron: '0 4 * * 1-5'   # UTC 04:00 = 北京 12:00（上午盘后）
    - cron: '0 8 * * 1-5'   # UTC 08:00 = 北京 16:00（下午盘后）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy akshare baostock tqdm openpyxl requests

      - name: 运行强势股扫描器
        run: |
          pwd
          ls -la
          ls -la results/ || true
          python stock_scanner_v79.py
          echo "===== 扫描后 results ====="
          ls -la results/ || echo "results 不存在"
          find results -name '*.xlsx' -type f 2>/dev/null || true

      - name: 提交结果并推送微信下载链接
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p results

          echo "===== 推送前 results ====="
          ls -la results/ || true

          # 优先 latest.xlsx；否则取任意最新 xlsx 复制为 latest
          if [ -f results/latest.xlsx ]; then
            echo "已有 latest.xlsx"
          else
            FILE=$(ls -t results/*.xlsx 2>/dev/null | head -n 1 || true)
            if [ -n "$FILE" ] && [ -f "$FILE" ]; then
              cp -f "$FILE" results/latest.xlsx
              echo "复制 $FILE -> results/latest.xlsx"
            fi
          fi

          if [ ! -f results/latest.xlsx ]; then
            echo "❌ 没有生成任何 Excel，跳过推送"
            echo "请向上翻看「运行强势股扫描器」是否 sys.exit 或 无有效数据"
            exit 1
          fi

          ls -la results/latest.xlsx

          # .gitignore 忽略了 results/ 与 *.xlsx，必须 -f
          git add -f results/latest.xlsx
          git add -f results/*.xlsx 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "auto stock scan $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
            echo "已 push"
          else
            echo "无变更，仍推送下载链接"
          fi

          DL_URL="https://github.com/${{ github.repository }}/raw/main/results/latest.xlsx"
          echo "Download: $DL_URL"

          if [ -z "${PUSHPLUS_TOKEN}" ]; then
            echo "未配置 PUSHPLUS_TOKEN，跳过微信推送"
            exit 0
          fi

          SCAN_DATE=$(TZ='Asia/Shanghai' date '+%m月%d日 %H:%M')
          RESP=$(curl -sS -X POST "https://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${PUSHPLUS_TOKEN}\",\"title\":\"A股扫描报告 ${SCAN_DATE}\",\"content\":\"${DL_URL}\",\"template\":\"txt\"}")
          echo "PushPlus 响应: $RESP"
