name: Daily A-share scan

on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy akshare baostock tqdm openpyxl requests

      - name: Run scanner
        run: python stock_scanner_v79.py

      - name: Commit and PushPlus
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p results
          FILE=$(ls -t results/*.xlsx 2>/dev/null | head -n 1 || true)
          if [ -z "$FILE" ]; then
            echo "No xlsx found, skip push"
            exit 0
          fi
          git add -f results/
          if ! git diff --staged --quiet; then
            git commit -m "auto stock scan"
            git push
          fi
          FILENAME=$(basename "$FILE")
          PAGE_URL="https://github.com/${{ github.repository }}/blob/main/results/${FILENAME}"
          RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/results/${FILENAME}"
          TITLE="A-share scan result"
          CONTENT="Scan finished. View: ${PAGE_URL} Download: ${RAW_URL} File: ${FILENAME}"
          curl -s -X POST "http://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${PUSHPLUS_TOKEN}\",\"title\":\"${TITLE}\",\"content\":\"${CONTENT}\",\"template\":\"txt\"}"
